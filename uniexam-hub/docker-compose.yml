version: '3.9'

services:
  # ─── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: uniexam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uniexam_hub
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - uniexam_net

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: uniexam_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - uniexam_net

  # ─── Backend ────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: uniexam_server
    restart: unless-stopped
    env_file: .env
    ports:
      - '5000:5000'
    depends_on:
      - postgres
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - uniexam_net

  # ─── Frontend ───────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: uniexam_client
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - uniexam_net

volumes:
  postgres_data:

networks:
  uniexam_net:
    driver: bridge
